apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: curlimages/curl:8.5.0
          command: ['sh','-c','until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: backend
          image: quarkus-hello:java25
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: hello-secrets
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: hello-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hello
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
